apis:
- name: Onepot API
  description: >-
    Programmatic access to onepot CORE for make-on-demand molecule discovery and
    synthesis. Run similarity (Tanimoto) and substructure (SMILES/SMARTS) search,
    optional retrosynthetic decomposition with building-block/price/risk filters,
    stream progress and results over server-sent events, and place synthesis
    orders. Accessed via the first-party Python client (pip install onepot) using
    an API key; access is gated ("Request API access").
