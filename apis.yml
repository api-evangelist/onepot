aid: onepot
name: Onepot
description: >-
  Onepot (onepot.ai) is a San Francisco-based startup building an AI-powered,
  fully automated custom synthesis platform for small-molecule drug discovery.
  It combines ultra-high-throughput lab automation in its POT-1 lab with an AI
  organic chemist ("Phil") and reaction foundation models to search, quote, and
  synthesize make-on-demand molecules end to end, aiming to replace slow,
  error-prone CRO workflows. Onepot exposes a developer API and a Python client
  (published on PyPI as "onepot") that lets teams run Tanimoto similarity and
  SMILES/SMARTS substructure search over the full onepot CORE compound space,
  perform retrosynthetic decomposition with building-block and price/risk
  filters, stream real-time results over server-sent events, and place synthesis
  orders programmatically from their own pipelines using an API key.
